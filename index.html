<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BayPilot for Superfix</title>
<meta name="description" content="BayPilot for Superfix Auto Centers: clickable demo of the garage management system">
<meta name="theme-color" content="#0d1b2e">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{
  --navy:#0d1b2e;--navy2:#13263f;--navy3:#1b3354;
  --red:#EC3542;--red-soft:#fde8ea;--blue:#1f4fbf;--blue-soft:#e8eefc;
  --ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e3e8ef;--line2:#eef2f7;
  --bg:#f3f5f9;--card:#ffffff;
  --green:#12a150;--green-soft:#e3f6ea;--amber:#e48a00;--amber-soft:#fff3dc;--late:#d92d20;--late-soft:#fde7e5;
  --violet:#6d4fd8;--violet-soft:#efeafd;--teal:#0e9488;--teal-soft:#dff5f2;
  --r:14px;--r-sm:10px;--sh:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.06);
  --sh-lg:0 10px 40px rgba(15,23,42,.18);
  --font:"Poppins","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow-x:hidden}.main{overflow-x:clip}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--navy);color:#cbd6e6;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:40}
.brand{padding:18px 18px 12px;display:flex;align-items:center;gap:11px}
.bp-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--red),#ff6a3d);display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(236,53,66,.35)}
.bp-mark svg{width:24px;height:24px}
.brand .t{font-weight:700;font-size:19px;color:#fff;letter-spacing:.2px;line-height:1.1}
.brand .s{font-size:11.5px;color:#8fa3bf}
.client{margin:4px 14px 10px;background:#fff;border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:10px}
.client img{height:40px;width:auto;display:block}
.client .ct{font-size:10.5px;color:var(--muted);line-height:1.25}
.client .ct b{display:block;color:var(--ink);font-size:12px}
.nav{flex:1;overflow:auto;padding:6px 10px 10px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:#647a99;margin:14px 10px 6px}
.nav button{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;background:transparent;color:#c6d2e3;border-radius:10px;text-align:left;font-size:14px;font-weight:500}
.nav button:hover{background:var(--navy2);color:#fff}
.nav button.on{background:linear-gradient(90deg,rgba(236,53,66,.22),rgba(236,53,66,.06));color:#fff;box-shadow:inset 3px 0 0 var(--red)}
.nav button svg{width:19px;height:19px;flex:none;opacity:.9}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:20px;font-size:11px;padding:1px 8px;font-weight:600}
.side-foot{padding:12px 14px;border-top:1px solid #1d3150;font-size:11.5px;color:#7f93b0}
.side-foot b{color:#fff;font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.demobar{background:linear-gradient(90deg,#1a0f2e,#2a1240 50%,#3a0f1f);color:#fff;display:flex;align-items:center;gap:10px;padding:7px 18px;font-size:12.5px;flex-wrap:wrap}
.demobar .tag{background:var(--red);border-radius:6px;padding:2px 8px;font-weight:700;letter-spacing:.6px;font-size:11px}
.demobar .lbl{color:#d7c9ef}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.roles button{white-space:nowrap;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;border-radius:30px;padding:5px 12px 5px 6px;display:flex;align-items:center;gap:7px;font-size:12.5px}
.roles button .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.roles button.on{background:#fff;color:var(--ink);border-color:#fff}
.demobar .sp{flex:1}
@media (max-width:1600px){.demobar .lbl{display:none}.roles button{padding:4px 10px 4px 5px}}
.demobar .dbtn{border:0;border-radius:8px;padding:6px 12px;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.dbtn.story{background:#ffd23f;color:#2b1a00}
.dbtn.explain{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)!important}
.dbtn.reset{background:transparent;color:#cdb8e8}

.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 22px;position:sticky;top:0;z-index:30}
.hamb{display:none;border:0;background:var(--bg);border-radius:10px;width:40px;height:40px;place-items:center}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px 10px 40px;outline:none}
.search input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px var(--blue-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;color:var(--muted)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg);overflow:hidden;z-index:50}
.sres button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 14px;border:0;background:#fff;text-align:left;border-bottom:1px solid var(--line2)}
.sres button:hover{background:var(--bg)}
.branchsel{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 12px;background:#fff}
.branchsel select{border:0;background:transparent;font-weight:600;font-size:14px;outline:none;max-width:230px}
.branchsel .pin{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.clock{font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.me{display:flex;align-items:center;gap:9px}
.me .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.me .n{font-weight:600;font-size:13px;line-height:1.2}
.me .r{font-size:11.5px;color:var(--muted)}

.page{padding:22px 24px 60px;max-width:1440px;width:100%}
.ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:24px;letter-spacing:-.3px}
.ph .sub{color:var(--muted);margin-top:2px}
.ph .sp{flex:1}

/* ---------- atoms ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line2)}
.card.pad{padding:18px}
.card h3{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g64{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap;transition:transform .05s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 14px rgba(236,53,66,.28)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:14px}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--line2);color:var(--ink2)}
.chip.g{background:var(--green-soft);color:#0b7a3b}.chip.a{background:var(--amber-soft);color:#9a5b00}.chip.r{background:var(--late-soft);color:#b42318}
.chip.b{background:var(--blue-soft);color:var(--blue)}.chip.v{background:var(--violet-soft);color:var(--violet)}.chip.t{background:var(--teal-soft);color:var(--teal)}
.chip.dk{background:var(--navy);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.lock{display:inline-flex;align-items:center;gap:4px;color:#8a94a6;background:repeating-linear-gradient(45deg,#f1f4f8,#f1f4f8 5px,#e7ebf1 5px,#e7ebf1 10px);border-radius:7px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.lock svg{width:12px;height:12px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.b{font-weight:600}
.right{text-align:right}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.hr{height:1px;background:var(--line);margin:14px 0}

table.t{width:100%;border-collapse:collapse}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;background:#fafbfd}
table.t td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#f8fafd}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
.tw{overflow:auto;border-radius:var(--r)}

.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:4px}
.kpi .d{font-size:12px;margin-top:2px}
.kpi .ic{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.kpi .ic svg{width:20px;height:20px}
.up{color:var(--green)}.down{color:var(--late)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field label .req{color:var(--red)}
.field input,.field select,.field textarea{border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.field .hint{font-size:11.5px;color:var(--muted)}
.field.err input,.field.err select{border-color:var(--late);background:#fff8f7}
.field .errm{font-size:12px;color:var(--late);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-weight:600;color:var(--ink2);min-width:54px}
.seg button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.seg.err button{border-color:#f3b4ae}
.seg.big button{padding:14px 18px;font-size:15px;display:flex;align-items:center;gap:8px}
.ins{display:flex;gap:8px}
.ins>*{flex:1}

/* stepper */
.steps{display:flex;gap:0;margin:0 0 18px;background:#fff;border-radius:14px;border:1px solid var(--line2);box-shadow:var(--sh);overflow:auto}
.steps .s{flex:1;display:flex;align-items:center;gap:10px;padding:13px 16px;font-weight:600;color:var(--muted);white-space:nowrap;position:relative;min-width:150px}
.steps .s .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line2);font-size:13px;flex:none}
.steps .s.done{color:var(--green)}.steps .s.done .n{background:var(--green);color:#fff}
.steps .s.cur{color:var(--ink);background:linear-gradient(180deg,#fff,#fff6f7)}.steps .s.cur .n{background:var(--red);color:#fff;box-shadow:0 0 0 4px var(--red-soft)}
.steps .s+.s:before{content:"";position:absolute;left:0;top:22%;bottom:22%;width:1px;background:var(--line)}

/* job status track */
.track{display:flex;align-items:center;gap:0;overflow:auto;padding:4px 0}
.track .st{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:96px;flex:1;position:relative;font-size:11.5px;color:var(--muted);font-weight:600;text-align:center}
.track .st .c{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;z-index:1}
.track .st:after{content:"";position:absolute;top:12px;left:50%;width:100%;height:2px;background:var(--line);z-index:0}
.track .st:last-child:after{display:none}
.track .st.done{color:var(--green)}.track .st.done .c{background:var(--green);border-color:var(--green);color:#fff}
.track .st.done:after{background:var(--green)}
.track .st.cur{color:var(--ink)}.track .st.cur .c{border-color:var(--red);background:var(--red);color:#fff;box-shadow:0 0 0 5px var(--red-soft)}
.track svg{width:14px;height:14px}

/* plates */
.plate{display:inline-flex;align-items:stretch;border:2px solid #1d1d1f;border-radius:7px;background:#fff;font-weight:800;line-height:1;overflow:hidden;font-family:"DIN Alternate","Arial Narrow",Arial,sans-serif;letter-spacing:.5px;box-shadow:0 1px 0 rgba(0,0,0,.06);vertical-align:middle}
.plate .pc{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px 7px;font-size:15px;min-width:30px}
.plate .pc small{font-size:7.5px;font-weight:700;letter-spacing:.3px;margin-top:2px}
.plate .pn{display:flex;align-items:center;padding:4px 10px;font-size:20px;color:#111}
.plate.ad .pc{background:#d32f2f;color:#fff}
.plate.du .pc{color:#111}
.plate.sh .pc{background:#f2f2f2;color:#111;border-right:1px solid #ccc}
.plate.aj .pc{color:#111}
.plate.ksa{border-color:#0b5d2a}.plate.ksa .pc{background:#0b5d2a;color:#fff}
.plate.om{border-color:#b71c1c}.plate.om .pc{background:#b71c1c;color:#fff}
.plate.qa{border-color:#6d1a36}.plate.qa .pc{background:#6d1a36;color:#fff}
.plate.bh,.plate.kw{border-color:#333}.plate.bh .pc{background:#c62828;color:#fff}.plate.kw .pc{background:#00733b;color:#fff}
.plate.lg .pn{font-size:30px;padding:8px 16px}.plate.lg .pc{font-size:22px;padding:6px 12px;min-width:46px}.plate.lg .pc small{font-size:9.5px}

/* modal / drawer / toast */
.ov{position:fixed;inset:0;background:rgba(10,18,32,.55);backdrop-filter:blur(2px);z-index:100;display:grid;place-items:center;padding:20px;animation:fi .15s}
.modal{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);width:min(560px,100%);max-height:92vh;overflow:auto;animation:pop .18s}
.modal.wide{width:min(860px,100%)}
.modal .mh{padding:18px 22px 6px;display:flex;align-items:flex-start;gap:10px}
.modal .mh h2{margin:0;font-size:19px}
.modal .mb{padding:10px 22px 20px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fafbfd;border-radius:0 0 18px 18px;position:sticky;bottom:0}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin-left:auto;flex:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:120;box-shadow:var(--sh-lg);display:flex;flex-direction:column;animation:slin .2s}
.drawer .dh{padding:18px 20px;background:linear-gradient(135deg,#1a0f2e,#3a0f1f);color:#fff}
.drawer .dh h2{margin:4px 0 0;font-size:19px}
.drawer .db{padding:18px 20px;overflow:auto;flex:1}
.drawer .db h4{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.drawer .say{background:#fffbea;border:1px solid #f6e3a1;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55}
.drawer ul{margin:0;padding-left:18px}.drawer li{margin:5px 0}
.req-ids{display:flex;flex-wrap:wrap;gap:6px}
.req-ids span{background:var(--navy);color:#fff;border-radius:6px;font-size:11.5px;padding:2px 7px;font-weight:600}
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:10px;font-weight:500;animation:pop .2s;max-width:92vw}
.toast.ok{background:#0d6b3a}.toast.warn{background:#9a4a00}.toast.err{background:#a3221a}
.toast svg{width:18px;height:18px;flex:none}
@keyframes fi{from{opacity:0}}
@keyframes pop{from{transform:scale(.96);opacity:0}}
@keyframes slin{from{transform:translateX(30px);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.live{animation:pulse 1.4s infinite}

/* story guide */
.story .stp{display:flex;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;align-items:flex-start;cursor:pointer;background:#fff}
.story .stp:hover{border-color:var(--blue);background:#f8faff}
.story .stp .n{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.story .stp.done .n{background:var(--green)}
.story .stp .tt{font-weight:600}
.story .stp .who{font-size:11.5px;color:var(--muted)}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(185px,1fr);gap:12px;overflow:auto;padding-bottom:8px}
.col{background:#eaeef4;border-radius:14px;padding:10px;min-height:300px}
.col .ch{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;padding:2px 4px 10px}
.col .ch .cnt{background:#fff;border-radius:20px;padding:0 8px;font-size:12px;color:var(--muted)}
.jc{background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(0,0,0,.05);border-left:4px solid var(--green);cursor:pointer;transition:transform .1s}
.jc:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.jc.amber{border-left-color:var(--amber)}.jc.red{border-left-color:var(--late);background:#fffafa}
.jc .no{font-weight:700;font-size:13px}
.jc .car{font-size:12.5px;color:var(--ink2);margin:3px 0 7px}
.jc .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.jc.story{box-shadow:0 0 0 2px #ffd23f,var(--sh)}
.mini-av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10px;font-weight:700}

/* gantt */
.gantt{position:relative;overflow-x:auto}
.gantt .gin{min-width:900px;position:relative}
.gantt .ax{display:grid;grid-template-columns:190px 1fr;font-size:11px;color:var(--muted)}
.gantt .ticks{position:relative;height:24px;border-bottom:1px solid var(--line)}
.gantt .ticks span{position:absolute;transform:translateX(-50%);top:4px}
.gantt .gr{display:grid;grid-template-columns:190px 1fr;border-bottom:1px solid var(--line2);min-height:64px}
.gantt .who{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 0}
.gantt .who .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.gantt .who .nm{font-weight:600;font-size:13px;line-height:1.2}
.gantt .who .ef{font-size:11.5px}
.gantt .lane{position:relative;background-image:linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:calc(100%/11) 100%}
.gantt .std{position:absolute;top:10px;height:44px;border:2px dashed #9fb3cf;border-radius:9px;background:rgba(31,79,191,.04)}

isor</td><td>Start on <b>My day</b> (the advisor home: one search, four big buttons, a to-do list with one button per line), then open Enquiries. Point at Mr. Ahmed Al Hammadi's card (WhatsApp source, follow-up time)</td><td>\"Every enquiry from walk-in, phone, WhatsApp or the website lands here, so none is lost. Lost ones keep a reason for the report. Companies and government departments can enquire too: <b>New enquiry</b> \u2192 <b>Company / fleet</b>.\"</td></tr><tr><td>2</td><td>Customer</td><td>Service advisor</td><td><b>Convert to job card</b>. Press <b>Next</b> without picking a title to show it is required, then pick <b>Mr</b>. Tap <b>Saudi</b> to show the phone code and ID type change, then back to <b>UAE</b></td><td>\"Title is required for every individual and is used on quotations, invoices and WhatsApp. Companies print as <b>M/s.</b> with a contact person who has their own title (try <b>Corporate / fleet</b>). GCC customers get their own phone and ID formats. The duplicate check covers all 17 branches.\"</td></tr><tr><td>3</td><td>Vehicle</td><td>Service advisor</td><td>Change <b>Registered in</b> to Dubai, then Oman, then back to Abu Dhabi and watch the plate preview</td><td>\"The plate fields follow the emirate or GCC country, and your admin sets them up without code.\"</td></tr><tr><td>4</td><td>Check-in and job card</td><td>Service advisor</td><td>Tap the car diagram to mark damage, add a photo, <b>Create job card</b></td><td>\"The number YAS-1483 is the next one in the Yas series. Al Qusais has its own, QUS-0731.\"</td></tr><tr><td>5</td><td>Quotation in three screens</td><td>Service advisor</td><td><b>Build quotation</b>. Screen 1: the two complaints from check-in already bring the 60,000 km service and the front brake pads, <b>Add to quotation</b>. Screen 2: change a quantity or the discount, add a note, <b>Next: reserve parts</b>. Screen 3: <b>Reserve parts &amp; save quotation</b></td><td>\"The quotation starts from what the customer told us at check-in. Details are a separate screen, and reserving is its own step: you see what is here, what is short, and where else it is. Spark plugs are short and the brake pads are not here, so both are marked Back ordered.\"</td></tr><tr><td>6</td><td>Customer approval</td><td>Service advisor</td><td><b>Send on WhatsApp</b>, then <b>Approve</b> on the customer's phone. Optionally untick a line first</td><td>\"The customer approves line by line. Unticked lines become deferred work for a reminder. Time and channel are recorded.\"</td></tr><tr><td>7</td><td>Cross-branch stock</td><td>Store manager</td><td>Stock planning: <b>Request 4 from Al Qusais</b>, then <b>Raise PO</b> for brake pads. Open <b>Transfers &amp; POs</b> and walk the transfer through Approve, Dispatch, Receive, then <b>Receive goods</b> on the PO</td><td>\"Beside every back-ordered part you see every branch's quantity, never its cost. One click raises a transfer, or a PO if no branch has it. When it arrives it is committed to the job and the advisor is told.\" Also try <b>Counter sale\u2026</b> on a committed part to show it is blocked. Then open the <b>Low stock</b> tab (or the bell at the top): \"Every part has a reorder level per branch. When free stock reaches it, you get an alert with days of cover, and one click requests it from a branch that has plenty or raises a PO. <b>Order all suggested</b> does the whole list.\"</td></tr><tr><td>8</td><td>Technician clocks in</td><td>Technician</td><td>Open the 60,000 km job, <b>Clock in</b>, <b>Pause</b> (Break), <b>Resume</b>, press <b>+1 hour</b> three times, then <b>Clock out</b> and pick a delay reason</td><td>\"Four big buttons, no typing and no prices. The ring shows actual time against the 2h 30m standard and turns red when over. Clocking out late asks why.\"</td></tr><tr><td>9</td><td>Live timeline</td><td>Branch manager</td><td>Technician time. Press <b>+15 min</b> and watch the running bars</td><td>\"The dashed box is the standard time and the bar is actual time: green, then amber, then red. Grey is a pause with its reason. Efficiency and idle time by reason are worked out for you.\"</td></tr><tr><td>10</td><td>Workshop board and QC</td><td>Service advisor</td><td>Workshop board. Click <b>add reason</b> on a late job. Open YAS-1483, <b>Quality check</b>, mark each check <b>Done</b> or <b>N/A</b> (or *Mark the rest done*), <b>Pass</b></td><td>\"Cards turn amber before they are late and red once they are. A late job needs a reason, which feeds the on-time report.\"</td></tr><tr><td>11</td><td>Invoice and payment</td><td>Service advisor</td><td><b>Create invoice</b> opens the <b>invoice draft</b>: read the automatic checks, reword a line, add the customer PO and a note, then <b>Post tax invoice</b>, <b>Print</b>, <b>Take payment</b></td><td>\"Nothing can be invoiced that is not on the job, and a job with missing labour or parts can't be invoiced. It's an FTA tax invoice with TRN, VAT per line, Arabic heading and QR.\"</td></tr><tr><td>12</td><td>Owner dashboard</td><td>Owner / HQ</td><td>Owner dashboard on All 17 branches. Click the Yas bar, then pick <b>All 17 branches</b> again from the branch switcher</td><td>\"Sales, cars in and out, on-time delivery and late jobs for every branch, live, without a phone call.\"</td></tr><tr><td>13</td><td>HR, attendance and WPS payroll</td><td>Owner / HQ</td><td>HR &amp; attendance: <b>Documents &amp; expiry alerts</b> tab, then <b>Attendance today</b>. Then Payroll &amp; WPS: <b>Calculate</b>, <b>Approve</b>, <b>Create WPS salary file</b>, <b>Download .SIF</b>. Switch to <b>Branch manager</b> to show salaries hidden</td><td>\"Visa, Emirates ID and labour card expiries are flagged 60, 30 and 7 days ahead. Attendance sits next to the technician's job clock times. Overtime flows into payroll, and the WPS file is ready for the bank. A mid-month branch move gets one payslip with the cost split by working days.\"</td></tr><tr><td>14</td><td>Prices hidden by role</td><td>Owner / HQ</td><td>Settings, <b>Who sees prices</b>. Open the quotation as Owner (cost and margin visible), then switch to <b>Service advisor</b> and <b>Technician</b></td><td>\"Cost and margin are removed on the server for advisors and technicians, on every screen, print and export. Your admin decides who sees what.\"</td></tr></tbody></table><p><b>Part 2: back office</b></p><table><thead><tr><th>#</th><th>Step</th><th>Role</th><th>What to click</th><th>What to say</th></tr></thead><tbody><tr><td>15</td><td>Approvals inbox</td><td>Owner / HQ</td><td>Approvals. <b>Approve</b> the AED 41,200 tyre PO (second step), <b>Reject</b> the 15% discount with a reason, then <b>How it looks on WhatsApp</b>. Open <b>Workflow settings</b> and switch Purchase request on</td><td>\"Everything that needs a yes waits here, from web, phone or a WhatsApp link. Each workflow and each step is a switch, with rules by amount, branch and discount, and a backup approver. A pending document is locked.\"</td></tr><tr><td>16</td><td>Accounts</td><td>Accountant</td><td>Accounts &amp; vouchers: point at today's automatic postings. Open the invoice for YAS-1483 and press <b>Accounting entry</b>. Then <b>New voucher</b>, <b>Submit for approval</b></td><td>\"From go-live Tally is read-only. Invoices, receipts, goods received, transfers, payroll and petty cash post themselves through a mapping the admin controls. Manual vouchers carry an attachment and need approval.\"</td></tr><tr><td>17</td><td>Bank reconciliation</td><td>Accountant</td><td>Bank &amp; reconciliation, <b>Import ENBD statement</b>, fix the 3 items (bank charges, card commission, match Al Noor), <b>Finish and lock October</b>. Then <b>Cheques &amp; PDC</b>, <b>Deposit</b></td><td>\"Nine of twelve lines match by themselves. People only deal with exceptions. When the difference is zero the month is locked and ticked on the period-close checklist.\"</td></tr><tr><td>18</td><td>VAT 201</td><td>Accountant</td><td>VAT return: the boxes by emirate, <b>VAT by branch</b>, then <b>E-invoicing &amp; audit file</b>, <b>Download FTA Audit File</b></td><td>\"The return fills itself from invoices, counter sales, supplier bills and petty cash, including reverse charge on imports. The audit file and e-invoicing data are ready.\"</td></tr><tr><td>19</td><td>Branch P&amp;L</td><td>Owner / HQ</td><td>Financial statements, <b>Branch P&amp;L side by side</b>, switch the head-office sharing rule. Then <b>Balance sheet</b></td><td>\"Every branch's profit side by side, with head office costs shared by the rule you choose. A branch manager sees only their own column.\"</td></tr><tr><td>20</td><td>Tally migration</td><td>Accountant</td><td>Tally migration: walk the five steps, fix the two differences, <b>Sign off</b></td><td>\"Masters, opening balances bill by bill, a trial balance your accountant signs, then one month in parallel before Tally is switched off.\"</td></tr><tr><td>21</td><td>Purchasing and sales</td><td>Purchasing officer, then Advisor</td><td>Purchasing: <b>New purchase order</b> at AED 14,600 (goes to the branch manager), <b>Goods received</b>, <b>Supplier invoices</b>, <b>Compare quotes</b>. As Advisor: <b>Counter &amp; trade sales</b>, add items, switch Retail to Trade, take payment; then <b>Payments &amp; cash closing</b></td><td>\"POs follow your limits by amount. Bills are paid only after they match the PO and the goods received. At the counter, prices follow the customer level and a branch can only sell its own free stock.\"</td></tr><tr><td>22</td><td>Reports</td><td>Owner / HQ</td><td>Reports: open <b>On-time delivery by branch, advisor and service</b>, switch <b>Data</b> to Archived</td><td>\"Every report in the BRD, filtered by branch, date, advisor and technician, exported with your permissions applied. Archived data is read-only.\"</td></tr></tbody></table><p><b>More to show if asked:</b> Bookings and after-hours key drop \u00b7 Parts &amp; stock count (blind count on a phone) \u00b7 Branch transfers (reject, short or damaged) \u00b7 on a job card: Extra work found, Split billing, Warranty comeback, Delivery walkthrough \u00b7 Technician time: correct a missed clock-out \u00b7 HR: Leave and Final settlement \u00b7 Users, roles &amp; audit (remove a leaver, quick PIN) \u00b7 Master forms (Customer titles) \u00b7 Archive &amp; import \u00b7 the <b>\u0639</b> button for Arabic.</p><p><b>If a question takes you off script:</b> use <b>Demo story</b> to jump back to any step. Each step sets up its own data, so you can skip around.</p><p><b>Good questions to invite</b></p><ul><li>\"Can we add our own bundles and standard times?\" Yes: Settings, Service bundles. It's a master form, so no code is needed.</li><li>\"Can the foreman assign jobs instead of the advisor?\" Yes, it's a setting (WS-02).</li><li>\"Arabic?\" English is the default. Press the <b>\u0639</b> button at the top: Arabic right-to-left is an option per user (UX-05), and the invoice already has an Arabic heading.</li><li>\"Does it replace Tally?\" Yes, fully (section 7.12). Show Accounts, Bank reconciliation, VAT and Tally migration.</li></ul><p>## One job from enquiry to car delivered (step by step)</p><p>Press <b>\u25b6 Guided job</b> in the dark top bar (or <b>Run one job live</b> on the Job card journey). A panel opens at the bottom left. It always shows the step you are on, and the button to press on the screen is outlined in red. If you get lost, press <b>Take me to step N</b> on the panel. It opens the right screen with the same job. You stay in the Service advisor role the whole time.</p><table><thead><tr><th>Step</th><th>What to click</th><th>What to type or say</th></tr></thead><tbody><tr><td>1. Enquiry</td><td>Panel: <b>Take me to step 1</b> \u2192 the New enquiry form opens \u2192 <b>Save enquiry</b></td><td>Change the name, mobile or car if you like. Say: \"Every enquiry is saved with the source and a follow-up time\"</td></tr><tr><td>2. Job card</td><td>Panel: <b>Take me to step 2</b> \u2192 the 3-step wizard opens with the enquiry filled in \u2192 <b>Next</b> \u2192 <b>Next</b> \u2192 <b>Create job card</b></td><td>Step 1 customer: title, name, pricing category. Step 2 car: plate. Step 3 check-in: complaint dropdown, odometer, fuel</td></tr><tr><td>3. Quotation</td><td><b>Build quotation</b> \u2192 screen 1 <b>Add to quotation</b> (work from the complaints) \u2192 screen 2 <b>Next: reserve parts</b> \u2192 screen 3 <b>Reserve parts &amp; save quotation</b> \u2192 <b>Send on WhatsApp</b></td><td>Say: \"Reserving holds the parts for this job\"</td></tr><tr><td>4. Approval</td><td>The customer's phone opens \u2192 <b>Approve</b></td><td>Say: \"The customer approves line by line from WhatsApp\"</td></tr><tr><td>5. Technician</td><td><b>Assign technicians</b> \u2192 <b>Assign to \u2026</b> on the best-fit card</td><td>Point out skill, clocked in or on leave, and free-from time. This step is skipped if the bundle already gave each line a technician</td></tr><tr><td>6. Work</td><td><b>Finish the work</b></td><td>Optional: <b>Technician's phone</b> to show clock in and out</td></tr><tr><td>7. QC</td><td><b>Quality check</b> \u2192 mark each check Done or N/A \u2192 <b>Pass \u2014 ready for pick-up</b></td><td>Pass stays locked until every check is answered</td></tr><tr><td>8. Invoice</td><td><b>Create invoice</b> \u2192 invoice draft (check, amend) \u2192 <b>Post tax invoice</b></td><td>The job is now saved as <b>Job completed</b></td></tr><tr><td>9. Payment</td><td><b>Take payment</b> \u2192 choose Card or Cash \u2192 <b>Confirm payment</b></td><td></td></tr><tr><td>10. Delivery</td><td><b>Deliver car</b> \u2192 <b>Car delivered to customer</b></td><td>The progress bar shows all steps green. Open <b>Customer's WhatsApp</b> to show every message the customer got</td></tr></tbody></table><p>To run it again, press <b>Start another</b> on the panel, or <b>Reset</b> in the top bar for a clean demo.</p><p>## Job card from start to finish (any job)</p><p>Works on every job card, not only the story car. Role: Advisor (or Owner). Open <b>Job cards</b>, pick any job. The blue <b>Next step</b> box always says what to do, and the big red button does it. <b>Customer's WhatsApp</b> (green) shows every message the customer has received so far.</p><table><thead><tr><th>Stage</th><th>Click</th><th>Customer's WhatsApp shows</th></tr></thead><tbody><tr><td>Booked (try YAS-1481)</td><td><b>Check in the car</b></td><td>Booking confirmed, car checked in</td></tr><tr><td>Checked in</td><td><b>Build quotation</b> \u2192 <b>Add to quotation</b> \u2192 <b>Next: reserve parts</b> \u2192 <b>Reserve parts &amp; save quotation</b> \u2192 <b>Send on WhatsApp</b> \u2192 customer's phone opens \u2192 <b>Approve</b></td><td>Quotation with approve link, then the customer's \u2705</td></tr><tr><td>Assign the technician</td><td><b>Assign technicians</b> (or <b>Assign technician</b> on a line) \u2192 cards show skill, clocked in or on leave, current job and *free from* time \u2192 <b>Assign to \u2026</b>, or <b>Best fit for every line</b></td><td>\u2014</td></tr><tr><td>Approved / In progress</td><td><b>Finish the work</b> (or <b>Technician's phone</b> to show clock in/out)</td><td>Work started, delays</td></tr><tr><td>Extra work found (optional)</td><td>Technician: <b>Found extra work</b> on the phone, or Advisor: <b>Extra work found</b> \u2192 tick the findings \u2192 <b>Build revised quotation</b> \u2192 <b>Send v2 on WhatsApp</b> \u2192 customer ticks what they approve \u2192 <b>Approve selected</b> (or <b>Decline all</b>)</td><td>Photos and revised quotation v2, then the customer's answer</td></tr><tr><td>Quality check</td><td><b>Quality check</b> \u2192 Done / N/A on each line \u2192 <b>Pass</b></td><td>Car ready, Pay now</td></tr><tr><td>Ready</td><td><b>Create invoice</b> \u2192 invoice draft \u2192 <b>Post tax invoice</b>: the job is saved as <b>Job completed</b></td><td>Invoice PDF</td></tr><tr><td>Job completed</td><td><b>Take payment</b> \u2192 <b>Confirm payment</b> \u2192 <b>Deliver car</b> \u2192 <b>Car delivered to customer</b> (if unpaid, it asks for payment first or a manager release)</td><td>Payment receipt, warranty, rating</td></tr></tbody></table><p>## If you are asked something you can't find</p><ul><li>Type any word in the <b>top search bar</b> (for example *trial balance*, *WPS*, *credit note*, *punching*). The first results are <b>functions and screens</b>, then customers, cars and jobs. Click one and the demo opens it as the right role.</li><li>Or press <b>Find a feature</b> (top bar), or <b>Ctrl+K</b>, for a bigger search across 217 functions, screens, master forms, reports and demo steps.</li><li>Every list screen has a <b>Search this page</b> box on the right of the title.</li></ul><p>## Explaining the job card flow to Superfix</p><p>Open <b>Job card journey</b> (left menu, Start here). It walks through 12 steps from enquiry to after-service. Each step shows who does it, what the customer receives on WhatsApp and the control that protects the business. <b>Show it live</b> opens the working screen.</p><p>## New in this round</p><table><thead><tr><th>What</th><th>Where to click</th></tr></thead><tbody><tr><td>Complaint list as a dropdown</td><td>Advisor \u203a <b>A car has arrived</b> \u203a Next \u203a Next \u203a <b>Customer complaint</b> dropdown. The list is managed in Owner \u203a <b>Master forms</b> \u203a <b>Customer complaints</b></td></tr><tr><td>Receivables and payables by branch</td><td>Finance manager \u203a <b>Receivables &amp; payables</b> \u203a <b>Branch</b> dropdown</td></tr><tr><td>Punching machines</td><td>Owner \u203a left menu <b>HR</b> \u203a <b>Punching machines</b> (press <b>Sync all now</b>)</td></tr><tr><td>WPS</td><td>Owner \u203a left menu <b>HR</b> \u203a <b>WPS salary files</b>, then <b>Open payroll to create the SIF</b></td></tr><tr><td>Job cards grid and search</td><td><b>Job cards</b> \u203a search box, status chips, <b>\u25a6 Cards</b> view</td></tr><tr><td>Consolidated P&amp;L by branch</td><td>Owner \u203a <b>Financial statements</b> \u203a <b>Consolidated P&amp;L by branch</b> (emirate chips filter it)</td></tr></tbody></table><p>## Round 7</p><table><thead><tr><th>What</th><th>Where to click</th></tr></thead><tbody><tr><td>Finance manager (was Accountant)</td><td>Top bar role <b>Finance</b></td></tr><tr><td>HR menu</td><td>Owner or Branch manager, left menu <b>HR</b>: Employee master, HR dashboard, Attendance today, Punching machines, Leave, Visas &amp; documents, Payroll, WPS salary files, Final settlement</td></tr><tr><td>Menu per user level</td><td>Owner \u203a <b>Users, roles &amp; audit</b> \u203a <b>Menu per user level</b> \u203a pick a role \u203a tick or untick screens</td></tr><tr><td>Customer category and price level</td><td><b>A car has arrived</b> \u203a customer step \u203a <b>Pricing</b>: individuals get Retail, Club, VIP or Staff; companies get a Customer type (Workshop, B2B, Service centre, Fleet\u2026) and a Price level. Lists live in Owner \u203a <b>Master forms</b></td></tr><tr><td>Return job</td><td><b>Bookings</b> \u203a <b>Book return job</b>, or a customer's profile, or an invoiced job card \u203a reason (comeback, deferred work, parts arrived, follow-up check) \u203a it is linked to the earlier job</td></tr><tr><td>Any enquiry to job card</td><td><b>Enquiries</b> \u203a <b>Convert to job card</b> on any open enquiry: customer, car and complaint are filled in</td></tr><tr><td>Voucher types</td><td>Finance \u203a <b>Accounts &amp; vouchers</b> \u203a <b>Vouchers &amp; day book</b> tab \u203a <b>New voucher</b> buttons; inside the form the type buttons switch the fields (Payment, Receipt, Journal, Contra, Sales, Purchase, Debit/Credit note, Branch transfer)</td></tr><tr><td>Stock by branch</td><td>Owner \u203a <b>Parts &amp; stock count</b> \u203a <b>Stock by branch</b></td></tr><tr><td>Is approval mandatory?</td><td>No. Owner \u203a <b>Approvals</b> \u203a <b>Workflow settings</b>: switch each transaction type on or off and set the amount limits</td></tr><tr><td>Assign a technician</td><td>Any job card \u203a <b>Assign technicians</b></td></tr><tr><td>Add an employee</td><td>Owner \u203a left menu <b>HR</b> \u203a <b>Employee master</b> \u203a <b>Add employee</b> (also on the HR dashboard). Personal, job and branch, visa and Emirates ID, salary and WPS, punch card ID</td></tr><tr><td>Enquiries list and search</td><td><b>Enquiries</b> opens as a list. Search by customer, company, mobile, car, plate, enquiry no. or job card no.; chips filter by status; <b>\u25a5 Board</b> shows the column view</td></tr><tr><td>Role buttons on a laptop</td><td>On screens narrower than 1420 px the role buttons show initials only (hover over one to see the name). The active role always shows its name</td></tr><tr><td>Job completed and car delivered</td><td>Any job card after the invoice: <b>Deliver car</b></td></tr><tr><td>Stock transfer between branches</td><td>Owner, Branch manager or Store \u203a <b>Stock transfers</b> (under Store, or the button on Parts &amp; stock count) \u203a <b>New stock transfer</b> \u203a From and To branch, parts and quantities \u203a <b>Save transfer</b> \u203a <b>Dispatch</b> (stock leaves the sender) \u203a <b>Receive</b> (stock arrives). Check it in <b>Stock by branch</b></td></tr><tr><td>Add and save a voucher</td><td>Finance \u203a <b>Accounts &amp; vouchers</b> \u203a <b>New voucher</b> (or a type button on the Vouchers &amp; day book tab) \u203a pick the type \u203a type the details, accounts, debit and credit (<b>Add line</b> for more) \u203a when it shows <b>Balanced</b>, press <b>Save voucher</b>. It posts at once with no approval. Approval can be switched on in Approvals \u203a Workflow settings</td></tr><tr><td>Add an account</td><td>Finance \u203a <b>Accounts &amp; vouchers</b> \u203a <b>Chart of accounts</b> \u203a <b>Add account</b> \u203a parent group, code, name, type, branch, opening balance \u203a <b>Save account</b></td></tr><tr><td>Job card journey</td><td>Now 13 steps, with <b>Assign technician</b> after Parts. <b>Run one job live (guided)</b> starts the guided job</td></tr><tr><td>Combined invoice (one customer, several job cards)</td><td><b>Invoices</b> \u203a <b>Combined invoice</b> (or <b>One invoice for N jobs</b> on a finished job card) \u203a pick the customer (Emirates Logistics has 3 finished fleet cars) \u203a tick the job cards \u203a <b>Post combined tax invoice</b>. Each job and car is listed with its own subtotal; every job card is marked invoiced with the same number. Then <b>Post to credit account</b> (or <b>Take payment</b>) and <b>Deliver all cars</b></td></tr><tr><td>Add items to a quotation</td><td><b>Build quotation</b> \u203a <b>Add item</b> \u203a Part (from stock, shows free quantity at the branch) or Labour (from the service master) \u203a search \u203a pick \u203a quantity \u203a <b>Add to quotation</b>. Remove items in the same window</td></tr><tr><td>What reserving parts does</td><td>Shown on quotation screen 3 (<b>Reserve parts</b>) before you save: the parts stay on the shelf but are held for the job, so free stock drops and nobody else can take them. Stock moves when the store issues them; declined or cancelled lines release them; missing parts are Back ordered</td></tr><tr><td>Branch manager</td><td>Now <b>Yousef Kareem</b> (YK), so the initials no longer look like \"HR\"</td></tr><tr><td>HR manager role</td><td>Top bar <b>HR</b> button (Leena Joseph) \u203a opens the HR dashboard with an HR-only menu: Employee master, Attendance, Punching machines, Leave, Visas &amp; documents, Payroll, WPS salary files, Final settlement</td></tr></tbody></table><p>## Quotation, invoice and leave (November update)</p><table><thead><tr><th>What</th><th>How to show it</th></tr></thead><tbody><tr><td>Quotation built from the complaints</td><td>Job card \u203a <b>Build quotation</b>. Screen 1 lists each complaint from check-in with its suggested labour and parts (from the complaint list and the service master for this car). Untick what is not needed, <b>Add item</b> for anything else, <b>Add to quotation</b></td></tr><tr><td>Quotation details</td><td>Screen 2: change part quantities, remove a line (\u2715), discount, valid for 7/14/30 days, note to the customer, internal note, <b>Next: reserve parts</b></td></tr><tr><td>Reserve parts</td><td>Screen 3: each part with stock here, free stock, what will be reserved, what is short and which branches have it. <b>Reserve parts &amp; save quotation</b> (labour-only: <b>Save quotation</b>), then <b>Send on WhatsApp</b></td></tr><tr><td>Invoice draft before posting</td><td><b>Create invoice</b> opens the draft: automatic checks, reword lines for the customer, customer PO, payment terms, printed note, parts as lines or one line, discount, <b>Print proforma</b>. <b>Post tax invoice</b> gives the number; then <b>Print</b>, <b>Send</b>, <b>Take payment</b>. A posted invoice cannot be edited (credit note only)</td></tr><tr><td>Quick invoice for small jobs</td><td>YAS-1480 (oil service) \u203a <b>Quick invoice (small job)</b>: tick the work and set part quantities (up to AED 1,000), <b>Create invoice draft</b>. No quotation, approval or QC; parts are issued from stock and the work is recorded as done</td></tr><tr><td>Employee leave (self-service)</td><td>Any role \u203a left menu <b>Me \u203a My leave</b>: balances (annual, sick, compassionate, parental), <b>Apply for leave</b> (type, dates, reason; Fridays not counted; sick leave of 2+ days needs a certificate; shows who else is off), <b>My requests</b> with status, <b>Cancel</b>. Try it as <b>Tech</b> (Ramesh)</td></tr><tr><td>Leave approval</td><td>Branch manager or HR \u203a <b>HR \u203a Leave</b>: pending requests with balance after and who else is off, <b>Approve</b> or <b>Reject</b> with a reason. The employee sees the answer on My leave at once</td></tr></tbody></table><p>## Presenter notes (after the demo-readiness review)</p><ul><li><b>Do not reload the page mid-story.</b> A reload restarts the demo from the beginning; the browser now asks before it reloads. Use <b>Reset</b> to start again on purpose.</li><li><b>Partial approval is safe to show.</b> Untick a line on the customer's phone and the total, VAT and the Approve button update at once, with the original total shown for comparison.</li><li><b>Reports download real files.</b> Excel (.csv, opens in Excel) and PDF both download. Figures are sample data and say so.</li><li><b>Arabic</b> translates the menus only in this demo. Present in English unless partial Arabic is fine.</li><li><b>Sample items</b> are labelled: the invoice QR graphic and the delivery signature are marked *sample*.</li><li><b>Requirement codes</b> (JC-01, PC-02 \u2026) are hidden on business screens. Show them with *Show requirement codes* at the bottom of the left menu.</li><li><b>On a phone</b>, tap <b>\u25be Hide</b> in the purple demo bar to give the screen back to the app.</li></ul>";</script>

/* ---------- job helpers ---------- */
const STAGES=[['booked','Booked'],['checkedin','Checked in'],['approval','Awaiting approval'],['approved','Approved'],['progress','In progress'],['parts','Awaiting parts'],['qc','Quality check'],['ready','Ready'],['invoiced','Invoiced']];
const STLBL=Object.fromEntries(STAGES);
const STCHIP={booked:'',checkedin:'b',approval:'v',approved:'t',progress:'b',parts:'a',qc:'v',ready:'g',invoiced:'dk'};
function segEnd(s){return s[1]==null?NOW():s[1]}
function lineActual(l){return (l.seg||[]).filter(s=>s[2]==='w').reduce((a,s)=>a+(segEnd(s)-s[0]),0)}
function lineStd(l){return SERVICES[l.svc].std}
function jobStd(j){return (j.lines||[]).reduce((a,l)=>a+lineStd(l),0)}
function jobAct(j){return (j.lines||[]).reduce((a,l)=>a+lineActual(l),0)}
function health(j){/* green/amber/red vs promised time & std */
 if(['invoiced','ready'].includes(j.status))return'';
 const now=NOW();
 if(now>j.promised)return'red';
 const anyOver=(j.lines||[]).some(l=>lineActual(l)>lineStd(l));
 if(anyOver||j.promised-now<45)return'amber';
 return'';
}
const isLate=j=>health(j)==='red';
function techs(j){return [...new Set((j.lines||[]).map(l=>l.tech).filter(Boolean))]}
function jobTotals(j){
 if(j.fixed){const sub=j.fixed.filter(x=>x[1]==="Labour").reduce((a,x)=>a+x[3],0),pt=j.fixed.filter(x=>x[1]!=="Labour").reduce((a,x)=>a+x[3],0),n=sub+pt;return {lab:sub,parts:pt,sub:n,disc:0,net:n,vat:n*.05,total:n*1.05,cost:pt*.62,margin:n-pt*.62-sub*.35}}
 let lab=0,parts=0,cost=0;
 (j.lines||[]).forEach(l=>{if(l.declined||l.pend)return;const s=SERVICES[l.svc];lab+=s.std/60*s.rate});
 (j.parts||[]).forEach(p=>{if(p.declined||p.pend)return;const P=PARTS[p.k];parts+=P.price*p.qty;cost+=P.cost*p.qty});
 const sub=lab+parts,disc=sub*(j.disc||0)/100,net=sub-disc,vat=net*.05;
 return {lab,parts,sub,disc,net,vat,total:net+vat,cost,margin:net-cost-(lab*.35)};
}

/* ---------- toast / modal / drawer ---------- */
function toast(msg,kind='ok',icon){
 const box=document.getElementById('toasts');const t=document.createElement('div');
 t.className='toast '+kind;t.innerHTML=ic(icon||(kind==='ok'?'check':kind==='err'?'x':'info'))+`<span>${msg}</span>`;
 box.appendChild(t);while(box.children.length>2)box.firstChild.remove();setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity=0;setTimeout(()=>t.remove(),300)},3200);
}
function openModal(fn){S.modal=fn;renderOverlay()}
function closeModal(){S.modal=null;renderOverlay()}
function renderOverlay(){
 const el=document.getElementById('overlay');
 let h='';
 if(S.modal)h+=`<div class="ov" onclick="if(event.target===this)closeModal()">${S.modal()}</div>`;
 if(S.drawer)h+=`<div class="ov" style="background:rgba(10,18,32,.25)" onclick="if(event.target===this){S.drawer=null;renderOverlay()}"></div><div class="drawer">${S.drawer()}</div>`;
 el.innerHTML=h;
}

function renderSearch(){

 const res=[];
 S.jobs.filter(j=>inScope(j.br)).forEach(j=>{const c=custOf(j.cust),v=vehOf(j.veh);if((j.no+' '+c.name+' '+v.num+' '+c.mob+' '+v.vin).toLowerCase().includes(q))res.push(`<button onmousedown="go('job',{no:'${j.no}'})">${ic('job','width:18px')}<div><b>${j.no}</b> · ${esc(cname(c))}<div class="tiny muted">${vname(v)} · ${STLBL[j.status]}</div></div></button>`)});
 S.cust.forEach(c=>{if((c.name+' '+c.mob+' '+c.id).toLowerCase().includes(q)){const vs=S.veh.filter(v=>v.cust===c.id);res.push(`<button onmousedown="go('customer',{id:'${c.id}'})">${ic('users','width:18px')}<div><b>${esc(cname(c))}</b> ${COUNTRIES[c.cc].flag}<div class="tiny muted">${COUNTRIES[c.cc].code} ${c.mob} · ${vs.length} vehicle(s)</div></div></button>`)}});
 S.veh.forEach(v=>{if((v.num+' '+v.code+v.num+' '+v.vin+' '+v.make+' '+v.model).toLowerCase().includes(q)){const c=custOf(v.cust);res.push(`<button onmousedown="go('customer',{id:'${c.id}'})">${plate(v)}<div><b>${vname(v)}</b><div class="tiny muted">${esc(cname(c))}</div></div></button>`)}});
 if(!res.length)res.push(`<div class="empty small">No match for “${esc(S.q)}”</div>`);
 wrap.insertAdjacentHTML('beforeend',`<div class="sres" id="sres">${res.slice(0,7).join('')}</div>`);
}

 if(last[2]==='w'&&lineActual(l)>lineStd(l)+40){last[1]=NOW()-(lineActual(l)-lineStd(l)-40);l.state='done';if(j.status==='progress')j.status='qc';if(!j.delay)j.delay='Extra work found'}
 if(last[2]==='p'&&NOW()-last[0]>240){last[1]=last[0]+240;l.seg.push([last[1],Math.min(NOW()-1,last[1]+lineStd(l)*.5),'w']);l.state='done';j.status='qc'}})})}

SCREENS.job=()=>{

  return `<tr ${l.declined?'style="opacity:.45"':''}><td><div class="b small">${s.name}</div><div class="tiny muted">${s.code} · standard ${dur(sd)}${l.declined?' · declined → deferred work':''}</div></td>

  <td style="min-width:170px"><div class="row tiny num" style="justify-content:space-between"><span>${dur(a)} actual</span><span class="muted">${dur(sd)} std</span></div><div style="height:8px;background:var(--line2);border-radius:5px;overflow:hidden;margin-top:4px;position:relative"><i style="display:block;height:100%;width:${pct/1.3}%;background:${col}"></i><span style="position:absolute;left:${100/1.3}%;top:0;bottom:0;width:2px;background:#334"></span></div></td>
  <td>${{idle:'<span class="chip">Not started</span>',run:'<span class="chip g live">● Clocked in</span>',paused:`<span class="chip a">Paused · ${(l.seg[l.seg.length-1]||[])[3]||''}</span>`,done:'<span class="chip dk">Done</span>'}[l.state]}${l.delay?`<div class="tiny" style="color:var(--late);margin-top:3px">Delay: ${l.delay}</div>`:''}</td>
  <td class="num">${money(s.std/60*s.rate,'price')}</td></tr>`}).join('');
 const parts=(j.parts||[]).map(p=>{const P=PARTS[p.k];return `<tr ${p.declined?'style="opacity:.45"':''}><td><div class="b small">${P.desc}</div><div class="tiny muted">${P.pn} · bin ${P.bin}</div></td><td class="num">${p.qty} ${P.unit}</td><td>${partChip(p)}</td><td class="num">${money(P.cost*p.qty,'cost')}</td><td class="num">${money(P.price*p.qty,'price')}</td></tr>`}).join('');
 return `<div class="ph"><div><div class="small muted"><a href="#" onclick="go('jobs');return false">Job cards</a> › ${BR(j.br).name}</div><h1 class="row" style="gap:12px">${j.no} ${statusChip(j.status,j)} ${healthChip(j)}</h1><div class="sub">${j.type} · ${esc(j.title)}</div></div><span class="sp"></span>${act}</div>
 <div class="card pad" style="margin-bottom:16px"><div class="track">${['Booked','Checked in','Awaiting approval','Approved','In progress','Quality check','Ready','Invoiced'].map((s,i)=>`<div class="st ${i<ci?'done':i===ci?'cur':''}"><span class="c">${i<ci?ic('check'):''}</span>${s}</div>`).join('')}</div></div>
 <div class="grid g64">
  <div class="grid" style="align-content:start">
   <div class="card"><div style="padding:16px 18px 4px"><h3>${ic('wrench','width:18px')} Labour <span class="sp"></span><span class="small muted">Actual vs standard time, live</span></h3></div>
    ${lab?`<div class="tw"><table class="t"><thead><tr><th>Service</th><th>Technician</th><th>Time</th><th>Clock</th><th class="num">Price</th></tr></thead><tbody>${lab}</tbody></table></div>`:`<div class="empty">No labour yet — build the quotation from a service bundle</div>`}</div>
   ${j.parts?`<div class="card"><div style="padding:16px 18px 4px"><h3>${ic('part','width:18px')} Parts <span class="sp"></span><span class="small muted">Reserved for this job when the quotation was saved</span></h3></div>
    ${parts?`<div class="tw"><table class="t"><thead><tr><th>Part</th><th class="num">Qty</th><th>Stock</th><th class="num">Cost</th><th class="num">Price</th></tr></thead><tbody>${parts}</tbody></table></div>`:'<div class="empty">No parts yet</div>'}
    ${T?`<div style="padding:12px 18px" class="row wrap"><span class="small muted">Total incl. VAT</span><b>${money(T.total,'price',1)}</b><span class="sp"></span>${can('margin')?`<span class="chip g">Margin ${money(T.margin,'margin')}</span>`:''}</div>`:''}</div>`:''}
  </div>
  <div class="grid" style="align-content:start">
   <div class="card pad"><h3>${ic('users','width:18px')} Customer & vehicle</h3><div class="b" style="font-size:16px">${esc(cname(c))}</div><div class="small muted">${COUNTRIES[c.cc].flag} ${COUNTRIES[c.cc].code} ${c.mob}</div>
    <div class="row" style="margin-top:10px">${plate(v,0)}<div><div class="small b">${vname(v)}</div><div class="tiny muted">${v.engine} · ${fmt(j.checkin?.odo||v.odo)} km</div></div></div>

function partChip(p){const m={committed:['g','Committed ✓'],backorder:['a','Back ordered'],requested:['v','Transfer requested'],approved:['v','Transfer approved'],transit:['b','In transit'],po:['b','On PO'],draft:['','Not saved'],declined:['r','Declined by customer'],released:['','Released · declined'],issued:['g','Issued to job ✓']};const [c,l]=p.declined&&!['issued'].includes(p.st)?(p.st==='released'?m.released:m.declined):(m[p.st]||['',p.st]);
 return `<span class="chip ${c}">${l}</span>${p.st==='issued'&&p.iss?`<div class="tiny muted">${p.iss.q} ${PARTS[p.k].unit} · ${p.iss.ref}</div>`:''}${p.st==='backorder'&&!p.declined&&p.have?`<div class="tiny muted">${p.have} here · ${p.qty-p.have} short</div>`:''}${p.ref?`<div class="tiny muted">${p.ref}</div>`:''}`}

/* ---------- technician time: Gantt ---------- */
const G0=8*60,G1=19*60;
SCREENS.gantt=()=>{
 const br=S.branch==='ALL'?'YAS':S.branch;
 const rows=Object.values(TECHS).map(t=>{const items=[];S.jobs.filter(j=>j.br===br).forEach(j=>(j.lines||[]).forEach(l=>{if(l.tech===t.id&&l.seg.length)items.push({j,l})}));return {t,items}});
 const sum=rows.map(r=>{let st=0,ac=0,idle=0,dst=0,dac=0;r.items.forEach(({l})=>{ac+=lineActual(l);st+=lineStd(l);if(l.state==='done'){dac+=lineActual(l);dst+=lineStd(l)}l.seg.filter(s=>s[2]==='p').forEach(s=>idle+=segEnd(s)-s[0])});return {...r,st,ac,idle,dst,dac,eff:dac?Math.round(dst/dac*100):0}});
 const pauseBy={};sum.forEach(r=>r.items.forEach(({l})=>l.seg.filter(s=>s[2]==='p').forEach(s=>pauseBy[s[3]]=(pauseBy[s[3]]||0)+segEnd(s)-s[0])));
 const totSt=sum.reduce((a,r)=>a+r.st,0),totAc=sum.reduce((a,r)=>a+r.ac,0),dSt=sum.reduce((a,r)=>a+r.dst,0),dAc=sum.reduce((a,r)=>a+r.dac,0);
 LIVE.push(()=>{const g=document.getElementById('gantt');if(g)g.innerHTML=ganttInner(rows)});
 return `<div class="ph"><div><h1>Technician time — today</h1><div class="sub">${BR(br).name} · every clock in, pause and clock out, against the standard time for each job</div></div><span class="sp"></span>

 <div class="grid g4" style="margin-bottom:16px">
  ${kpi('Workshop efficiency',(dAc?Math.round(dSt/dAc*100):0)+'%','Standard ÷ actual, finished jobs','clock','#1f4fbf')}
  ${kpi('Hours clocked',dur(totAc),'Booked standard: '+dur(totSt),'wrench','#12a150')}
  ${kpi('Idle (paused) time',dur(Object.values(pauseBy).reduce((a,b)=>a+b,0)),'Mostly: '+(Object.entries(pauseBy).sort((a,b)=>b[1]-a[1])[0]||['—'])[0],'pause','#e48a00')}
  ${kpi('Jobs over standard',sum.reduce((a,r)=>a+r.items.filter(({l})=>lineActual(l)>lineStd(l)).length,0),'Turn amber at 85%, red at 100%','alert','#d92d20')}
 </div>
 <div class="card pad"><div class="row wrap" style="margin-bottom:10px"><h3 style="margin:0">Timeline</h3><span class="sp"></span><div class="legend"><span><i style="border:2px dashed #9fb3cf;background:#fff"></i>Standard time</span><span><i style="background:var(--green)"></i>Working, within standard</span><span><i style="background:var(--amber)"></i>Near standard</span><span><i style="background:var(--late)"></i>Over standard</span><span><i style="background:repeating-linear-gradient(45deg,#cfd6e1,#cfd6e1 3px,#e3e8ef 3px,#e3e8ef 6px)"></i>Paused</span></div></div>

function ganttInner(rows){
 const W=G1-G0,x=m=>((Math.max(G0,Math.min(G1,m))-G0)/W*100);const now=NOW();
 let h=`<div class="gin"><div class="ax"><div></div><div class="ticks">${Array.from({length:12},(_,i)=>`<span style="left:${i/11*100}%">${String(8+i).padStart(2,'0')}:00</span>`).join('')}</div></div>`;
 rows.forEach(({t,items})=>{
  let ac=0,st=0;items.forEach(({l})=>{ac+=lineActual(l);st+=lineStd(l)});
  const run=items.find(({l})=>l.state==='run');
  h+=`<div class="gr"><div class="who"><div class="av" style="background:${t.col}">${t.ini}</div><div><div class="nm">${t.name}</div><div class="ef ${run?'':'muted'}">${run?`<span style="color:var(--green)" class="b">● On ${run.j.no}</span>`:items.some(({l})=>l.state==='paused')?'<span style="color:var(--amber)" class="b">❚❚ Paused</span>':'Available'}</div></div></div><div class="lane">`;
  items.forEach(({j,l})=>{const s0=l.seg[0][0],sd=lineStd(l);
   h+=`<div class="std" style="left:${x(s0)}%;width:${x(s0+sd)-x(s0)}%" title="Standard ${dur(sd)}"></div>`;
   let acc=0,lbIdx=0,labelled=false;l.seg.forEach(s=>{const e=segEnd(s);
    if(s[2]==='p'){h+=`<div class="seg p" style="left:${x(s[0])}%;width:${Math.max(.4,x(e)-x(s[0]))}%" title="Paused: ${s[3]} (${dur(e-s[0])})">❚❚ ${s[3]}</div>`;return}
    /* split work into green (0-85% of std), amber (85-100%), red (over std) */
    const len=e-s[0];const cuts=[[0,sd*.85,'w'],[sd*.85,sd,'warn'],[sd,1e9,'over']];let first=true;
    cuts.forEach(([c0,c1,cls])=>{const a0=Math.max(acc,c0),a1=Math.min(acc+len,c1);if(a1<=a0)return;
     const t0=s[0]+(a0-acc),t1=s[0]+(a1-acc);const w=x(t1)-x(t0);
     const lbl=cls==='over'?(w>2.5?`+${dur(acc+len-sd)}`:''):(!labelled&&w>3?(labelled=true,`${j.no} · ${SERVICES[l.svc].name}`):'');
     h+=`<div class="seg ${cls} ${s[1]==null&&a1===acc+len?'run':''}" style="left:${x(t0)}%;width:${Math.max(.4,w)}%" onclick="go('job',{no:'${j.no}'})" title="${j.no} · ${SERVICES[l.svc].name} · ${dur(lineActual(l))} of ${dur(sd)} standard">${lbl}</div>`;
     if(cls!=='over')lbIdx++;first=false});
    acc+=len});
  });
  h+=`</div></div>`;
 });
 h+=`<div class="now" style="left:calc(190px + (100% - 190px) * ${x(now)/100})" data-t="${hm(now)}"></div></div>`;
 return h;
}

function ensureStory(stage){
 const want=ORDER.indexOf(stage);
 quietly(()=>{
  if(want>=1&&!jobOf('YAS-1483')){startWizardSilent();S.wiz.c.title=S.wiz.c.title||'Mr';createStoryJob(true);S.wiz=null}

  if(want>=3&&j.quote==='sent'){approveQuote(j.no);S.modal=null}
  if(want>=4){
   j.parts.forEach(p=>{if(p.st==='backorder'){otherStock(p.k,j.br).length?requestTransfer(j.no,p.k):raisePO(j.no,p.k)}});
   S.transfers.forEach(t=>{while(t.st!=='received')trStep(t.id)});
   S.pos.forEach(p=>{if(p.st==='sent')poReceive(p.id)});
  }
  const L=j.lines;const now=NOW();
  if(want>=5&&L[0]&&L[0].state==='idle'){L[0].seg=[[Math.max(700,now-40),null,'w']];if(now<740)S.nowBase+=740-now;L[0].state='run';j.status='progress';hist(j,'Ramesh clocked in · 60,000 km Major Service')}
  if(want>=6){
   if(L[0]&&L[0].state!=='done'){const s0=L[0].seg.length?L[0].seg[0][0]:700;L[0].seg=[[s0,s0+120,'w'],[s0+120,s0+135,'p','Break'],[s0+135,s0+180,'w']];L[0].state='done';L[0].delay='Extra work found'}
   if(L[1]&&L[1].state!=='done'){const s1=L[0].seg[2][1]+5;L[1].seg=[[s1,s1+52,'w']];L[1].state='done'}
   if(j.status!=='qc'&&ORDER.indexOf(S.story.stage)<6){j.status='qc';hist(j,'All labour clocked out')}
   if(NOW()<L[1].seg[0][1]+5){S.nowBase+=L[1].seg[0][1]+5-NOW();wrapUpOthers()}
  }
  if(want>=7&&j.status==='qc')passQC(j.no);
  if(want>=8&&j.status==='ready'){postInvoice(j.no);S.modal=null}
  S.modal=null;
  if(ORDER.indexOf(S.story.stage)<want)S.story.stage=stage;
 });
}

function custGreet(c){if(!c)return 'Customer';if(c.type&&c.type!=='Individual'&&c.cp)return cpName(c);return (c.title?c.title+'. ':'')+c.name.split(' ').slice(-2).join(' ')}

 return `<div class="bars">${labels.map((l,i)=>`<div class="br" style="grid-template-columns:${lw}px 1fr 78px"><span class="small">${l}</span><div class="bt"><i style="width:${vals[i]/mx*100}%;background:${Array.isArray(col)?col[i%col.length]:col||(hl===i?'var(--red)':'#1f4fbf')}"></i></div><b class="num small">${pct?Math.round(vals[i]/tot*100)+'%':fmtv(vals[i])}${pct?` <span class="tiny muted">${fmt(vals[i])}</span>`:''}</b></div>`).join('')}</div>`}
function stack11(labels,vals,cols){const tot=vals.reduce((a,b)=>a+b,0)||1;
 return `<div class="stk11">${vals.map((v,i)=>`<i style="width:${v/tot*100}%;background:${cols[i]}" title="${labels[i]}: ${Math.round(v/tot*100)}%"></i>`).join('')}</div><div class="lg11">${labels.map((l,i)=>`<span><i style="background:${cols[i]}"></i>${l} <b>${Math.round(vals[i]/tot*100)}%</b></span>`).join('')}</div>`}
const top11=(labels,vals)=>labels[vals.indexOf(Math.max(...vals))];

/* ---- view switcher shown on every owner dashboard view ---- */
function dviewTabs(){const v=S.dview||'ovr';return `<div class="dview11 tabs">${[['ovr','Overview','dash'],['enq','Enquiries by branch','enq'],['cust','Branch details','users']].map(([k,l,i])=>`<button class="${v===k?'on':''}" onclick="S.dview='${k}';render()">${ic(i,'width:15px;height:15px;vertical-align:-3px;margin-right:5px')}${l}</button>`).join('')}</div>`}
function dHead11(title){const all=S.branch==='ALL',p=S.dper||'day';
 return `<div class="ph"><div><h1>${title}</h1><div class="sub">${PSUB11[p]} · ${all?'17 branches across 5 emirates':BR(S.branch).name+', '+BR(S.branch).em}</div></div><span class="sp"></span>
 <div class="tabs">${[['day','Today'],['week','Last 7 days'],['month','Last 30 days']].map(([k,l])=>`<button class="${p===k?'on':''}" onclick="S.dper='${k}';render()">${l}</button>`).join('')}</div></div>`+dviewTabs()}
function brRowGo(id){S.branch=id;render();toast(`Showing ${BR(id).name} branch`,'ok','swap')}

/* ---------- Enquiries by branch ---------- */
function dashEnq(){const all=S.branch==='ALL',p=S.dper||'day',L=PLBL11[p];
 const brs=all?BRANCHES.map(b=>b.id):[S.branch];const st=brs.map(b=>enqStat(b,p));const z=enqSum(st);
 const sort=S.esort||'tot';const rows=st.slice().sort((a,b)=>sort==='cpct'?b.cpct-a.cpct:sort==='lost'?b.lost-a.lost:sort==='reply'?a.reply-b.reply:b.tot-a.tot);
 const live=S.enq.filter(e=>inScope(e.br)&&(e.status==='new'||e.status==='follow'));
 let h=dHead11(all?'Enquiries by branch':BR(S.branch).name+' — enquiries');
 h+=`<div class="grid g5" style="margin-bottom:16px">
  ${kpi('Enquiries '+L,fmt(z.tot),all?'Across 17 branches':'WhatsApp, phone, walk-in, website, social','enq','#1f4fbf')}
  ${kpi('Turned into jobs',fmt(z.conv),z.cpct+'% conversion · target 60%','check','#12a150',z.cpct>=60?'up':'')}
  ${kpi('Lost',fmt(z.lost),Math.round(z.lost/z.tot*100)+'% · top reason: '+top11(ELOST,z.lostBy),'alert','#d92d20')}
  ${kpi('First reply',z.reply+' min','Average time to answer · target 15 min','clock','#e48a00')}
  ${kpi('Still open',fmt(z.open),z.nw+' new · '+z.fol+' waiting for follow-up','bell','#6d4fd8')}
 </div>`;
 if(all){const mx=Math.max(...st.map(s=>s.tot));
  h+=`<div class="grid g64"><div class="card pad"><h3>Enquiries by branch — ${L} <span class="sp"></span><span class="small muted">Green = turned into a job · click a bar to open the branch</span></h3>
   <div class="vbars">${st.map(s=>`<div class="vb" style="cursor:pointer" title="${BR(s.b).name}: ${s.tot} enquiries, ${s.conv} converted (${s.cpct}%)" onclick="brRowGo('${s.b}')"><b>${fmt(s.tot)}</b><div class="ev11" style="height:${s.tot/mx*120}px"><i style="height:${s.conv/s.tot*100}%"></i></div><span>${s.b}</span></div>`).join('')}</div></div>
   <div class="card pad"><h3>Where enquiries come from</h3>${stack11(ESRC,z.src,ESRCC)}<div style="margin-top:14px">${hb11(ESRC,z.src,{col:ESRCC,pct:true,lw:130})}</div></div></div>`;
  h+=`<div class="card" style="margin-top:16px"><div class="row" style="padding:16px 18px 0"><h3 style="margin:0">Branch by branch — ${L}</h3><span class="sp"></span><span class="small muted">Sort by</span>
   <div class="tabs">${[['tot','Most enquiries'],['cpct','Best conversion'],['lost','Most lost'],['reply','Fastest reply']].map(([k,l])=>`<button class="${sort===k?'on':''}" onclick="S.esort='${k}';render()">${l}</button>`).join('')}</div></div>
   <div class="tw"><table class="t" id="enqtbl"><thead><tr><th>Branch</th><th class="num">Enquiries</th>${ESRC.map(s=>`<th class="num">${s.split(' ')[0]}</th>`).join('')}<th class="num">Converted</th><th class="num">Conversion</th><th class="num">Lost</th><th class="num">Reply</th><th class="num">Open</th>${can('price')?'<th class="num">Job value</th>':''}</tr></thead><tbody>
   ${rows.map(s=>`<tr style="cursor:pointer" onclick="brRowGo('${s.b}')"><td style="white-space:nowrap"><b>${BR(s.b).name}</b><div class="tiny muted">${BR(s.b).em}</div></td><td class="num b">${fmt(s.tot)}</td>${s.src.map(v=>`<td class="num">${fmt(v)}</td>`).join('')}<td class="num">${fmt(s.conv)}</td><td class="num"><span class="chip ${s.cpct>=65?'g':s.cpct>=58?'b':'a'}">${s.cpct}%</span></td><td class="num">${fmt(s.lost)}</td><td class="num" style="color:${s.reply>15?'var(--late)':'inherit'}">${s.reply} min</td><td class="num">${fmt(s.open)}</td>${can('price')?`<td class="num">AED ${fmt(s.value)}</td>`:''}</tr>`).join('')}
   <tr style="background:var(--bg)"><td class="b">All branches</td><td class="num b">${fmt(z.tot)}</td>${z.src.map(v=>`<td class="num b">${fmt(v)}</td>`).join('')}<td class="num b">${fmt(z.conv)}</td><td class="num b">${z.cpct}%</td><td class="num b">${fmt(z.lost)}</td><td class="num b">${z.reply} min</td><td class="num b">${fmt(z.open)}</td>${can('price')?`<td class="num b">AED ${fmt(z.value)}</td>`:''}</tr></tbody></table></div></div>`;
  h+=`<div class="grid g3" style="margin-top:16px"><div class="card pad"><h3>What customers ask for</h3>${hb11(EASK,z.ask,{pct:true,lw:170,col:'#0e9488'})}</div>
   <div class="card pad"><h3>Why enquiries are lost</h3>${hb11(ELOST,z.lostBy,{pct:true,lw:170,col:'#d92d20'})}</div>
   <div class="card pad"><h3>By emirate</h3>${(()=>{const ems=['Abu Dhabi','Al Ain','Sharjah','Dubai','Ajman'];const e=ems.map(em=>enqSum(st.filter(s=>BR(s.b).em===em)));return `<div class="tw"><table class="t"><thead><tr><th>Emirate</th><th class="num">Enquiries</th><th class="num">Converted</th><th class="num">Reply</th></tr></thead><tbody>${ems.map((em,i)=>`<tr><td class="b">${em}</td><td class="num">${fmt(e[i].tot)}</td><td class="num">${e[i].cpct}%</td><td class="num">${e[i].reply} min</td></tr>`).join('')}</tbody></table></div>`})()}</div></div>`;
 }else{const s=st[0];const fun=[['Enquiries received',s.tot],['Quotation sent',s.quoted],['Turned into a job card',s.conv]];
  h+=`<div class="grid g3"><div class="card pad"><h3>From enquiry to job</h3>${fun.map(([l,v],i)=>`<div class="fun11" style="width:${100-i*14}%"><span>${l}</span><b>${fmt(v)}</b><span class="tiny">${Math.round(v/s.tot*100)}%</span></div>`).join('')}<div class="tiny muted" style="margin-top:8px">${fmt(s.lost)} lost · ${fmt(s.open)} still open</div></div>
   <div class="card pad"><h3>Where enquiries come from</h3>${stack11(ESRC,s.src,ESRCC)}<div style="margin-top:14px">${hb11(ESRC,s.src,{col:ESRCC,pct:true,lw:130})}</div></div>
   <div class="card pad"><h3>Why enquiries are lost</h3>${hb11(ELOST,s.lostBy,{pct:true,lw:160,col:'#d92d20'})}</div></div>
   <div class="grid g64" style="margin-top:16px"><div class="card pad"><h3>What customers ask for</h3>${hb11(EASK,s.ask,{pct:true,lw:190,col:'#0e9488'})}</div>
   <div class="card pad"><h3>Open enquiries now <span class="sp"></span><button class="btn sm" onclick="go('enq')">Open enquiries</button></h3>${live.length?live.map(e=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line2)"><span class="chip ${e.status==='new'?'b':'a'}">${e.status==='new'?'New':'Follow up'}</span><span class="small"><b>${esc(e.name)}</b> · ${esc(e.ask)}</span><span class="sp"></span><span class="tiny muted">${e.src} · ${e.follow}</span></div>`).join(''):'<div class="empty small">No open enquiries at this branch right now</div>'}</div></div>`;
 }
 return h}

/* ---------- Branch details (branch by branch) ---------- */
function dashCust(){const all=S.branch==='ALL',p=S.dper||'day',L=PLBL11[p];
 const brs=all?BRANCHES.map(b=>b.id):[S.branch];const st=brs.map(b=>custStat(b,p));const z=custSum(st);
 const m=PMUL11[p]||1;const sales=b=>Math.round(BSTAT[b][0]*m),cin=b=>Math.round(BSTAT[b][1]*m);
 const avg=Math.round(brs.reduce((a,b)=>a+BSTAT[b][0],0)/brs.reduce((a,b)=>a+BSTAT[b][1],0));
 const util=Math.round(st.reduce((a,s)=>a+s.util*BR(s.b).bays,0)/st.reduce((a,s)=>a+BR(s.b).bays,0));
 let h=dHead11(all?'Branch details':BR(S.branch).name+' — branch details');
 h+=`<div class="grid g5" style="margin-bottom:16px">
  ${kpi('Bays / technicians',brs.reduce((a,b)=>a+BR(b).bays,0)+' / '+st.reduce((a,s)=>a+s.tech,0),all?'Across 17 branches':BR(S.branch).em,'car','#1f4fbf')}
  ${kpi('Bay use '+L,util+'%','Target 85%','clock','#0e9488',util>=85?'up':'')}
  ${kpi('Active customers',fmt(z.active),'Visited in the last 12 months','users','#6d4fd8')}
  ${kpi('New customers '+L,fmt(z.newC),z.ret+'% of cars were returning customers','plus','#12a150','up')}
  ${kpi('Average spend',can('price')?'AED '+fmt(avg):'—','Per car, invoiced','cash','#EC3542')}
 </div>`;
 const sort=S.bsort||'sales';const rows=st.slice().sort((a,b)=>sort==='util'?b.util-a.util:sort==='rating'?b.rating-a.rating:sort==='avg'?b.avg-a.avg:BSTAT[b.b][0]-BSTAT[a.b][0]);
 if(all){h+=`<div class="card"><div class="row" style="padding:16px 18px 0"><h3 style="margin:0">Branch by branch — ${L}</h3><span class="sp"></span><span class="small muted">Sort by</span>
  <div class="tabs">${[['sales','Sales'],['util','Bay use'],['avg','Avg spend'],['rating','Rating']].map(([k,l])=>`<button class="${sort===k?'on':''}" onclick="S.bsort='${k}';render()">${l}</button>`).join('')}</div></div>
  <div class="tw"><table class="t" id="brtbl"><thead><tr><th>Branch</th><th class="num">Bays</th><th class="num">Technicians</th>${can('price')?'<th class="num">Sales</th>':''}<th class="num">Cars in</th><th class="num">On time</th><th class="num">Bay use</th><th class="num">Active customers</th><th class="num">New</th><th class="num">Returning</th>${can('price')?'<th class="num">Avg spend</th>':''}<th class="num">Rating</th></tr></thead><tbody>
  ${rows.map(s=>`<tr style="cursor:pointer" onclick="brRowGo('${s.b}')"><td style="white-space:nowrap"><b>${BR(s.b).name}</b><div class="tiny muted">${BR(s.b).em}</div></td><td class="num">${BR(s.b).bays}</td><td class="num">${s.tech}</td>${can('price')?`<td class="num b">AED ${fmt(sales(s.b))}</td>`:''}<td class="num">${fmt(cin(s.b))}</td><td class="num">${BSTAT[s.b][3]}%</td><td class="num"><span class="chip ${s.util>=85?'g':s.util>=75?'b':'a'}">${s.util}%</span></td><td class="num">${fmt(s.active)}</td><td class="num">${fmt(s.newC)}</td><td class="num">${s.ret}%</td>${can('price')?`<td class="num">AED ${fmt(s.avg)}</td>`:''}<td class="num">★ ${s.rating} <span class="tiny muted">${s.reviews}</span></td></tr>`).join('')}</tbody></table></div></div>
  <div class="tiny muted" style="margin-top:8px">Click a branch to open its own dashboard.</div>`}
 else{const s=st[0],B=BR(s.b);const avgAll=custSum(BRANCHES.map(b=>custStat(b.id,p)));const cmp=(l,v,a,u='')=>`<div class="row small" style="padding:6px 0;border-bottom:1px solid var(--line2)"><span>${l}</span><span class="sp"></span><b>${v}${u}</b><span class="tiny muted" style="width:120px;text-align:right">all branches ${a}${u}</span></div>`;
  const allAvg=Math.round(BRANCHES.reduce((a,b)=>a+BSTAT[b.id][0],0)/BRANCHES.reduce((a,b)=>a+BSTAT[b.id][1],0));
  const allUtil=Math.round(BRANCHES.reduce((a,b)=>a+custStat(b.id,p).util,0)/17),allOt=Math.round(BRANCHES.reduce((a,b)=>a+BSTAT[b.id][3],0)/17);
  h+=`<div class="grid g2"><div class="card pad"><h3>Branch details</h3>${[['Emirate',B.em],['Bays',B.bays],['Technicians',s.tech],['Opening hours','Sat–Thu 7:30–21:00 · Fri 14:00–21:00'],['Google rating','★ '+s.rating+' ('+s.reviews+' reviews)'],['Job card series',B.id+'-'+String(B.next).padStart(4,'0')]].map(([k,v])=>`<div class="row small" style="padding:6px 0;border-bottom:1px solid var(--line2)"><span class="muted">${k}</span><span class="sp"></span><b>${v}</b></div>`).join('')}</div>
  <div class="card pad"><h3>Compared with all branches — ${L}</h3>${cmp('On-time delivery',BSTAT[s.b][3],allOt,'%')}${cmp('Bay use',s.util,allUtil,'%')}${cmp('Returning customers',s.ret,avgAll.ret,'%')}${can('price')?cmp('Average spend','AED '+fmt(s.avg),'AED '+fmt(allAvg)):''}${cmp('Enquiry conversion',enqStat(s.b,p).cpct,enqSum(BRANCHES.map(b=>enqStat(b.id,p))).cpct,'%')}</div></div>`}
 return h}

const _dash11=SCREENS.dash;SCREENS.dash=()=>{const v=S.dview||'ovr';if(v==='enq')return dashEnq();if(v==='cust')return dashCust();return afterPh(_dash11(),dviewTabs())};

/* presenter notes & how-to */
if(typeof EXPLAIN!=='undefined'&&EXPLAIN.dash){EXPLAIN.dash.say+=' Two more views sit beside the overview: Enquiries by branch (where enquiries come from, how many turn into jobs, why they are lost) and Branch details (bays, technicians, sales, bay use, customers and rating for every branch).';
 EXPLAIN.dash.pts.push('Enquiries by branch: source, conversion, lost reasons, first-reply time','Branch details: bays, technicians, sales, bay use, returning customers, rating');
 EXPLAIN.dash.try.push('Open Enquiries by branch and sort by Best conversion','Open Branch details, sort by Bay use, then click a branch')}
HOWTO.unshift(['See enquiries by branch','Owner dashboard › Enquiries by branch: source, conversion, lost reasons, reply time','owner',"S.branch='ALL';S.dview='enq';go('dash')",'BO-1'],['See branch details','Owner dashboard › Branch details: bays, technicians, sales, bay use, customers and rating per branch','owner',"S.branch='ALL';S.dview='cust';go('dash')",'BO-1']);

/* ---------- boot ---------- */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){S.modal=null;S.drawer=null;renderOverlay()}});
render();
setTimeout(()=>{let seen=false;try{seen=!!sessionStorage.getItem('bp-hello');sessionStorage.setItem('bp-hello','1')}catch(e){}if(!seen)openStory()},400);

</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
